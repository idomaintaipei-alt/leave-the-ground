header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0 16px;border-bottom:1px solid var(--line)}

.camps{display:flex;gap:6px;align-items:center;margin:14px 0 0;font-size:11px;letter-spacing:.2em;color:var(--ink2)}
.camps i{display:block;height:2px;flex:1;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.camps i::after{content:"";position:absolute;inset:0;background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform .6s}
.camps i.done::after{transform:scaleX(1)}
.camps i.now::after{transform:scaleX(var(--p,0));transition:transform .4s linear}

section{display:none;animation:up .9s ease both}
section.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{font-weight:300;font-size:30px;line-height:1.35;letter-spacing:.06em;margin:34px 0 10px}
.lead{color:var(--ink2);font-size:14.5px;line-height:1.95;margin-bottom:26px}
.lead b{color:var(--ink);font-weight:500}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);padding:20px 14px;border-radius:14px;

.mood small{display:block;color:var(--ink2);font-size:12px;letter-spacing:.05em;margin-top:4px}
.mood:hover{background:rgba(255,255,255,.07);border-color:rgba(233,228,216,.4)}
.mood:active{transform:scale(.98)}
.mood.wide{grid-column:1/-1;text-align:center}

.q{margin-top:16px;font-size:27px;line-height:1.75;font-weight:500;letter-spacing:.04em;text-wrap:balance;opacity:0;transition:opacity 2.2s ease}
.q.in{opacity:1}
.q::before{content:"「";color:var(--ember);margin-left:-.5em}
.q::after{content:"」";color:var(--ember)}
.src{margin-top:18px;font-size:13px;line-height:1.8;color:var(--ink2);opacity:0;transition:opacity 1.6s ease}

.why{margin-top:22px;font-size:15.5px;line-height:2;color:var(--ink);opacity:0;transition:opacity 1.8s ease}
.why.in{opacity:1}
.ask{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.9;color:var(--ember);opacity:0;transition:opacity 1.8s ease}
.ask.in{opacity:1}
.hint{margin-top:26px;font-size:12px;letter-spacing:.2em;color:var(--ink2);opacity:.75}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:12px 18px;font-family:inherit;font-size:15px;letter-spacing:.08em;cursor:pointer;transition:background .25s,opacity .6s}

.btn.pri{background:var(--ink);color:var(--sky0);border-color:var(--ink)}

a.btn{text-decoration:none;display:inline-block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sky0);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

footer{margin-top:34px;color:var(--ink2);font-size:12px;line-height:1.9;letter-spacing:.05em}

const $=s=>document.querySelector(s), altEl=$("#alt b"), mtn=$("#mtn"), bars=[...document.querySelectorAll("#camps i")];

function pick(){
  let pool=QUOTES.filter((q,i)=>!used.has(i)&&(mood==="any"||q.m.includes(mood)));
  if(!pool.length) pool=QUOTES.filter((q,i)=>!used.has(i));
  const q=pool[Math.floor(Math.random()*pool.length)]; used.add(QUOTES.indexOf(q)); return q;
}
function show(id){document.querySelectorAll("section").forEach(s=>s.classList.remove("on"));const el=$(id);el.classList.add("on");el.style.animation="none";el.offsetHeight;el.style.animation="";window.scrollTo({top:0,behavior:"smooth"});}
function setAlt(v){altEl.textContent=Math.round(v).toLocaleString();}

function camp(){
  cur=pick(); picked.push(cur);
  const bk=cur.b?BOOKS[cur.b]:null;
  $("#camp-tag").textContent=(step===0?MOODS[mood].open+"　　":"")+CAMPS[step]+"　"+(bk?`METERS ${String(cur.b).padStart(2,"0")}`:"METERS 總序");
  $("#q-text").textContent=cur.q;
  $("#q-src").innerHTML=bk?`<b>《${bk.t}：${bk.s}》</b>　${bk.a}　｜　${cur.by}`:cur.by;
  $("#q-why").textContent=cur.why; $("#q-ask").textContent=cur.ask;
  const bb=$("#b-book"); if(bk){bb.style.display="";bb.href=bk.u;}else bb.style.display="none";
  ["#q-text","#q-src","#q-why","#q-ask"].forEach(s=>$(s).classList.remove("in"));
  const up=$("#b-up"); up.disabled=true; up.textContent="往上"; $("#hint").textContent="字還在出現，先讀。";
  show("#s-camp");
  setTimeout(()=>$("#q-text").classList.add("in"),200);
  setTimeout(()=>$("#q-src").classList.add("in"),2600);
  setTimeout(()=>$("#q-why").classList.add("in"),4800);
  setTimeout(()=>$("#q-ask").classList.add("in"),8000);
  // 停留＝上升
  bars.forEach((b,i)=>{b.classList.toggle("done",i<step);b.classList.toggle("now",i===step);b.style.setProperty("--p",0);});
  const base=alt, gain=600+Math.floor(Math.random()*300); t0=performance.now(); dragBonus=0;
  clearInterval(timer);
  timer=setInterval(()=>{
    const s=(performance.now()-t0)/1000+dragBonus, k=Math.min(1,s/STAY);
    setAlt(base+gain*k); bars[step].style.setProperty("--p",k);
    if(k>=1){ alt=base+gain; up.disabled=false; $("#hint").textContent="讀完了，再往上。或者，再多停一下也可以。"; clearInterval(timer); }
    else if(s>8){ $("#hint").textContent="還有一個問題，留給你。"; }
    mtn.style.transform=`translateY(${-(step*18+18*k)}px) scale(${1+(step+k)*0.04})`;
    document.body.classList.toggle("high",base+gain*k>1500);
  },100);
}
function summit(){
  bars.forEach(b=>{b.classList.add("done");b.classList.remove("now");});
  $("#summit-h").textContent=`你到山頂了。`;
  $("#summit-lead").innerHTML=`今天你離開地面 <b>${alt.toLocaleString()}</b> 公尺，帶走三句話。<br>哪一句停住了你，就從那本書開始。`;
  const R=$("#recap"); R.innerHTML="";
  picked.forEach(q=>{const bk=q.b?BOOKS[q.b]:null; const d=document.createElement("div");
    d.innerHTML=`<div class="rq">「${q.q}」</div>`+(bk?`<a href="${bk.u}" target="_blank" rel="noopener"><span>${String(q.b).padStart(2,"0")}</span>《${bk.t}》${bk.s}</a>`:`<a><span>00</span>meters 書系總序</a>`);
    R.appendChild(d);});
  show("#s-summit");
}
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800);}
async function share(text){ if(navigator.share){try{await navigator.share({text});return;}catch(e){}} window.open("https://www.threads.net/intent/post?text="+encodeURIComponent(text),"_blank"); }
const site=()=>location.href.split(/[?#]/)[0];

document.querySelectorAll(".mood").forEach(b=>b.addEventListener("click",()=>{
  mood=b.dataset.m; document.body.dataset.mood=mood; document.querySelector(".r1").setAttribute("d",MOODS[mood].ridge);
  step=0;alt=0;used.clear();picked=[];camp();}));
/* 手指往上滑＝往上爬（只在營地畫面；每滑 1 像素算 0.02 秒） */
(function(){let y0=null;
 const on=()=>$("#s-camp").classList.contains("on");
 addEventListener("pointerdown",e=>{if(on()) y0=e.clientY;});
 addEventListener("pointermove",e=>{if(y0===null||!on()) return; const dy=y0-e.clientY; if(dy>0){dragBonus+=dy*0.02; y0=e.clientY;}});
 addEventListener("pointerup",()=>{y0=null;}); addEventListener("pointercancel",()=>{y0=null;});
})();
$("#b-up").onclick=()=>{ step++; if(step>=3) summit(); else camp(); };
$("#b-share").onclick=()=>{const bk=cur.b?BOOKS[cur.b]:null; share(`「${cur.q}」\n── ${bk?`《${bk.t}》`:"meters 書系總序"}，${cur.by}\n\n${cur.ask}\n${site()}`);};
$("#b-share2").onclick=()=>share(`今天在「離開地面」停了三個營地，離開地面 ${alt.toLocaleString()} 公尺。\n十本山岳文學，一次一句。\n${site()}`);
$("#b-again").onclick=()=>{clearInterval(timer);alt=0;step=0;used.clear();picked=[];setAlt(0);mtn.style.transform="";document.body.classList.remove("high");delete document.body.dataset.mood;bars.forEach(b=>{b.classList.remove("done","now");b.style.setProperty("--p",0);});show("#s-start");};

(function(){const c=$("#stars"),x=c.getContext("2d");let W,H,S=[];
 function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;S=[];for(let i=0;i<140;i++)S.push({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.3*devicePixelRatio+.3,p:Math.random()*6.28});}
 function dr(t){x.clearRect(0,0,W,H);for(const s of S){x.globalAlpha=.35+.45*Math.sin(t/900+s.p);x.fillStyle="#e9e4d8";x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}requestAnimationFrame(dr);}
 addEventListener("resize",rs);rs();requestAnimationFrame(dr);})();
</script>
</body>
</html>
