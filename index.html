<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離開地面｜三句話，三個營地</title>
<meta name="description" content="挫折的時候，先離開地面一公尺。三句山岳文學的話，三個營地，停留就是上升。">
<meta property="og:title" content="離開地面｜三句話，三個營地">
<meta property="og:description" content="你現在在哪裡？點一個，山會帶你上去。">
<meta name="theme-color" content="#0e1620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--sky0:#0e1620;--sky1:#1b2a3a;--sky2:#2a3a4a;--ink:#e9e4d8;--ink2:#a8b3bf;--ember:#d98b5f;--line:rgba(233,228,216,.18);--m1:#223447;--m2:#1a2a3b;--m3:#131f2c}
/* 每種心情一種天色 */
body[data-mood=stuck]{--sky0:#0b0f14;--sky1:#161c24;--sky2:#2a2f36;--ember:#c97a4f;--m1:#1f262e;--m2:#171d24;--m3:#0f1419}
body[data-mood=tired]{--sky0:#141a2a;--sky1:#23304a;--sky2:#3a4a63;--ember:#d9a16a;--m1:#2a3650;--m2:#202a40;--m3:#161e2e}
body[data-mood=lost]{--sky0:#10171a;--sky1:#1c2a2c;--sky2:#2e4144;--ember:#c9a05a;--m1:#223538;--m2:#1a2a2c;--m3:#121e20}
body[data-mood=quit]{--sky0:#160f12;--sky1:#2a1b22;--sky2:#3e2a33;--ember:#d96c5f;--m1:#352430;--m2:#281a24;--m3:#1b1118}
body[data-mood=any]{--sky0:#0e1a2a;--sky1:#1b3350;--sky2:#2f5070;--ember:#e0b06a;--m1:#244060;--m2:#1a3050;--m3:#122238}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;color:var(--ink);
  background:var(--sky2);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#skybg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 52%,var(--sky2) 100%);transition:background 2s}   /* 天空固定貼在螢幕，頁面再長也不重複 */
.r1{fill:var(--m1)}.r2{fill:var(--m2)}.r3{fill:var(--m3)}
.r1,.r2,.r3{transition:fill 2s}
.sans{font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
#stars{position:fixed;inset:0;pointer-events:none}
#sun{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;background:radial-gradient(circle at 84% 78%,rgba(255,236,200,.5),rgba(255,236,200,0) 30%)}
#mtn{position:fixed;left:0;right:0;bottom:-10dvh;height:54dvh;pointer-events:none;transition:transform 2.5s cubic-bezier(.2,.7,.2,1);will-change:transform;transform:translateZ(0)}
#mtn svg{width:100%;height:100%;display:block}
.snow{fill:#cfd8e0;opacity:0;transition:opacity 2s}
main{touch-action:pan-y}
.drag{margin-top:10px;font-size:12px;letter-spacing:.2em;color:var(--ink2);opacity:.6}
body.high .snow{opacity:.22}   /* 背景不准比字張揚 */

main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 22px 42dvh}
header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0 16px;border-bottom:1px solid var(--line)}
header .k{font-size:12px;letter-spacing:.35em;color:var(--ink2)}
#alt{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.12em;color:var(--ink2)}
#alt b{color:var(--ink);font-weight:500;font-size:18px;margin-right:2px}

/* 營地進度 */
.camps{display:flex;gap:6px;align-items:center;margin:14px 0 0;font-size:11px;letter-spacing:.2em;color:var(--ink2)}
.camps i{display:block;height:2px;flex:1;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.camps i::after{content:"";position:absolute;inset:0;background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform .6s}
.camps i.done::after{transform:scaleX(1)}
.camps i.now::after{transform:scaleX(var(--p,0));transition:transform .4s linear}

section{display:none;animation:up .9s ease both}
body.shot section{animation:none}
body[data-align=center] .q{text-align:center;padding-left:0}
body[data-align=center] .q::before{margin-left:0}
body[data-align=end] .q{text-align:right;padding-left:0;padding-right:.2em}
body[data-align=end] .q::before{margin-left:0}
body.shot{width:375px;overflow:hidden}
body.shot main{width:375px}
body.shot #mtn,body.shot #sun,body.shot #stars,body.shot #skybg{width:375px;right:auto}
body.shot .q,body.shot .src,body.shot .why,body.shot .ask,body.shot .intro-line,body.shot .intro-acts{transition:none}
section.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 開場三句 */
.intro-line{white-space:pre-line;margin:26dvh 0 0;min-height:4.6em;font-size:24px;line-height:1.8;font-weight:300;letter-spacing:.06em;text-wrap:balance;opacity:0;transition:opacity 1.8s ease}
.intro-line.in{opacity:1}
.intro-acts{display:flex;gap:10px;margin-top:28px;opacity:0;transition:opacity 1.2s ease .6s}
.intro-acts.in{opacity:1}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.senses{margin-top:18px}
.senses .btn{font-size:13px;padding:9px 14px}
.senses .btn.on{color:var(--ember)}
.back{margin-top:16px;font-size:12.5px;letter-spacing:.15em;color:var(--ink2)}
#s-camp .card-tilt{transition:opacity .25s linear}
/* 風景 */
.view-line{margin:38dvh 0 0;font-size:15px;letter-spacing:.3em;color:var(--ink2);opacity:0;transition:opacity 2.5s ease}
.view-line.in{opacity:.8}
.view-acts{opacity:0;transition:opacity 1.5s ease;pointer-events:none}
.view-acts.in{opacity:1;pointer-events:auto}
/* 留在這裡 */
.stay-line{margin-top:26px;font-size:15.5px;line-height:2;color:var(--ink2)}
h1{font-weight:300;font-size:30px;line-height:1.35;letter-spacing:.06em;margin:34px 0 10px}
.lead{color:var(--ink2);font-size:14.5px;line-height:1.95;margin-bottom:26px}
.lead b{color:var(--ink);font-weight:500}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);padding:20px 14px;border-radius:14px;
  font-family:inherit;font-size:17px;letter-spacing:.08em;cursor:pointer;transition:background .25s,transform .15s,border-color .25s;text-align:left;line-height:1.5}
.mood small{display:block;color:var(--ink2);font-size:12px;letter-spacing:.05em;margin-top:4px}
.mood:hover{background:rgba(255,255,255,.07);border-color:rgba(233,228,216,.4)}
.mood:active{transform:scale(.98)}
.mood.wide{grid-column:1/-1;text-align:center}

/* 營地：一句話 */
.camp-tag{margin-top:30px;font-size:12px;letter-spacing:.3em;color:var(--ink2);opacity:.7}
.camp-tag .open{display:block;margin-bottom:6px;letter-spacing:.15em;color:var(--ink2)}
.q{white-space:pre-line;padding-left:1.2em;margin-top:16px;font-size:27px;line-height:1.75;font-weight:500;letter-spacing:.04em;text-wrap:balance;opacity:0;transition:opacity 2.2s ease}
.q.in{opacity:1}
.q::before{content:"「";color:var(--ember);margin-left:-1em}
.q.tight{padding-left:0;margin-left:-14px;margin-right:-14px;letter-spacing:-.02em}
.q.tight::before{margin-left:0}
.q.tight::after{margin-right:-1em}
.q::after{content:"」";color:var(--ember)}
.src{margin-top:18px;font-size:13px;line-height:1.8;color:var(--ink2);opacity:0;transition:opacity 1.6s ease}
.src.in{opacity:1}
.src b{color:var(--ink);font-weight:500;display:block}
.src .sub{display:block;color:var(--ink2)}
.src .who{display:block;margin-top:4px}
.why{margin-top:22px;font-size:15.5px;line-height:2;color:var(--ink);opacity:0;transition:opacity 1.8s ease}
.why.in{opacity:1}
.ask{white-space:pre-line;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.9;color:var(--ember);opacity:0;transition:opacity 1.8s ease}
.ask.in{opacity:1}
.hint{margin-top:26px;font-size:12px;letter-spacing:.2em;color:var(--ink2);opacity:.75}
.book{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.95;color:var(--ink);animation:up .6s ease both}
.book .pub{font-size:12px;letter-spacing:.05em;color:var(--ink2);margin:0 0 12px;line-height:1.8}
.book .pub b{display:block;color:var(--ink);font-weight:500;font-size:15px;letter-spacing:.04em}
.book .pub i{display:block;font-style:normal;color:var(--ink2);margin-bottom:2px}
.book p{margin:0 0 12px;text-align:justify}
.book .go{display:inline-block;margin-top:2px;font-size:13px;letter-spacing:.08em;color:var(--ember);text-decoration:none;border-bottom:1px solid var(--ember);padding-bottom:1px}
.book .src-note{display:block;margin-top:14px;font-size:11.5px;letter-spacing:.05em;color:var(--ink2);opacity:.75}
#b-book.on{background:rgba(255,255,255,.1);color:var(--ember);border-color:var(--ember)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.acts.row{flex-wrap:nowrap;gap:8px}
.acts.row .btn{padding:11px 6px;font-size:clamp(12px,3.6vw,14px);letter-spacing:.02em;white-space:nowrap;flex:1 1 0;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis}
.acts.row .btn.pri{flex:0 0 auto;padding:11px 18px}
.acts.tight{margin-top:4px}
.acts.tight .btn{padding:8px 6px;font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:12px 18px;font-family:inherit;font-size:15px;letter-spacing:.08em;cursor:pointer;transition:background .25s,opacity .6s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.pri{background:var(--ink);color:var(--sky0);border-color:var(--ink)}
.btn.pri:hover{background:#fff}
.btn[disabled]{opacity:.25;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sky0);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* 山頂 */
.summit h1{font-size:26px}
.recap{margin-top:18px;border-top:1px solid var(--line)}
.recap div{padding:14px 0;border-bottom:1px solid var(--line)}
.recap .rq{font-size:16px;line-height:1.75;white-space:pre-line}
.recap a{display:block;margin-top:6px;font-size:12.5px;color:var(--ink2);text-decoration:none;letter-spacing:.05em}
.recap a span{color:var(--ember);margin-right:6px}
footer{margin-top:34px;color:var(--ink2);font-size:12px;line-height:1.9;letter-spacing:.05em}
footer .note{display:block;margin-top:8px}
@media (min-width:600px){.q{font-size:31px}h1{font-size:34px}}
</style>
</head>
<body>
<div id="skybg"></div>
<canvas id="stars"></canvas>
<div id="sun" aria-hidden="true"></div>
<div id="mtn" aria-hidden="true">
  <svg viewBox="0 0 1000 420" preserveAspectRatio="none">
    <path class="r1" d="M0,420 L0,300 L80,250 L150,290 L240,170 L300,230 L380,120 L430,180 L520,90 L600,190 L680,140 L760,220 L840,160 L920,240 L1000,200 L1000,420 Z"/>
    <path class="snow" d="M380,120 L360,150 L400,145 Z M520,90 L498,128 L545,122 Z"/>
    <path class="r2" d="M0,420 L0,340 L120,300 L200,330 L290,260 L360,300 L450,230 L540,290 L640,240 L720,300 L800,260 L900,320 L1000,290 L1000,420 Z"/>
    <path class="r3" d="M0,420 L0,380 L140,350 L260,375 L370,330 L480,365 L590,320 L700,360 L820,335 L920,370 L1000,350 L1000,420 Z"/>
  </svg>
</div>

<main>
  <header>
    <div class="k sans" id="skyname">離開地面　LEAVE THE GROUND</div>
    <div id="alt" class="sans"><b>0</b>m</div>
  </header>
  <div class="camps sans" id="camps"><span>地面</span><i></i><span>一</span><i></i><span>二</span><i></i><span>三</span><i></i><span>山頂</span></div>

  <section id="s-intro" class="on">
    <p class="intro-line" id="intro-line"></p>
    <div class="intro-acts">
      <button class="btn pri" id="b-intro-next">下一句</button>
      <button class="btn ghost" id="b-intro-skip">跳過</button>
    </div>
  </section>

  <section id="s-start">
    <h1>你現在在哪裡？</h1>
    <p class="lead">不用回答別人，點一個就好。<br><b>三句話，三個營地。</b>每一句，字會慢慢出現；<br>你停留多久，就往上多少。不用急。</p>
    <div class="moods">
      <button class="mood" data-m="stuck">撐不下去<small>每一步都重</small></button>
      <button class="mood" data-m="tired">很累<small>不是身體，是心</small></button>
      <button class="mood" data-m="lost">迷路了<small>不知道為何繼續</small></button>
      <button class="mood" data-m="quit">想放棄<small>終點似乎不值得</small></button>
      <button class="mood wide" data-m="any">還行，只是想看看山</button>
    </div>
    <div class="acts senses">
      <button class="btn ghost" id="b-geo" hidden>讓山知道你在多高</button>
    </div>
    <p class="back sans" id="back-line" hidden></p>
    <p class="back sans" id="build-line"></p>
  </section>

  <section id="s-camp">
    <div class="camp-tag sans" id="camp-tag"></div>
    <p class="q" id="q-text"></p>
    <div class="src" id="q-src"></div>
    <p class="why" id="q-why"></p>
    <p class="ask" id="q-ask"></p>
    <div class="hint sans" id="hint">字還在出現，先讀。</div>
    <div class="acts row">
      <button class="btn pri" id="b-up" disabled>往上</button>
      <button class="btn" id="b-share">Threads</button>
      <button class="btn" id="b-ig">IG</button>
      <button class="btn" id="b-book">這本書</button>
    </div>
    <div class="acts tight"><button class="btn ghost" id="b-stay">今天到這裡就好</button></div>
    <div class="book sans" id="q-book" hidden></div>
  </section>

  <!-- 風景：營地之間，什麼都不做 -->
  <section id="s-view" class="view">
    <p class="view-line" id="view-line">不用做什麼。</p>
    <div class="acts view-acts" id="view-acts">
      <button class="btn pri" id="b-view-go">好了，往上</button>
      <button class="btn ghost" id="b-view-stay">今天到這裡就好</button>
    </div>
  </section>

  <!-- 留在這裡：不攻頂 -->
  <section id="s-stay" class="stay">
    <div class="camp-tag sans" id="stay-tag"></div>
    <p class="q in" id="stay-q"></p>
    <div class="src in" id="stay-src"></div>
    <p class="stay-line">今天到這裡。<br>山還在，書也還在，下次再來。</p>
    <div class="acts">
      <button class="btn" id="b-stay-share">把這句分享到 Threads</button>
      <button class="btn" id="b-stay-ig">分享到 Instagram</button>
      <a class="btn" id="b-stay-book" href="#" target="_blank" rel="noopener">這本書</a>
      <button class="btn ghost" id="b-stay-again">改天再爬</button>
    </div>
  </section>

  <section id="s-summit" class="summit">
    <h1 id="summit-h"></h1>
    <p class="lead" id="summit-lead"></p>
    <div class="recap" id="recap"></div>
    <div class="acts">
      <button class="btn pri" id="b-again">再爬一次</button>
      <button class="btn" id="b-share2">把今天分享到 Threads</button>
      <button class="btn" id="b-ig2">分享到 Instagram</button>
    </div>
    <footer>引句取自臉譜出版「meters 山岳文學書系」各書中文版的書介、導讀與書名；書系由詹偉雄策畫．選書．導讀，2020–2024 共十本。<span class="note">這個網頁是一個讀者做的，與出版社無關。</span></footer>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>

};
/* 這本書：節錄自《離開地面：十本山岳文學，十個問題》（1151126），只取自中文版書介、目錄與導讀 */
const BLURB={
 0:{pub:"臉譜 meters 山岳文學書系｜詹偉雄 策畫．選書．導讀｜2020–2024",
    ps:["這套書講的不是怎麼爬山，是人為什麼要離開地面。十本，十個不同的人，有的和搭檔一起消失在聖母峰，有的七十三歲才把年輕時的手札寫成書，有的不出名、不靠山吃飯，每年夏天還是去。",

 1:{pub:"彼得．博德曼 著｜陳秋萍 譯｜臉譜 2020",
    ps:["一九七五年，二十五歲的彼得．博德曼跟著一支百人大隊登上聖母峰，是隊裡最年輕的一個。照理說，他該滿足了。可是隔年，他和大他三歲的喬．塔斯克，兩個人，去了印度的強卡邦峰：一面乳白色的花崗岩壁，垂直向上一千五百公尺。因為會發亮，被叫作輝耀之山。",
        "四十天，其中四個夜晚是吊在岩壁上睡的。書裡最誠實的地方不是攀登，是彼得寫自己：喬是他焦慮的來源，他老覺得自己像個跟班。一九八二年五月，兩個人一起消失在聖母峰東北脊。",
        "詹偉雄說，這是一本關於青春的山岳文學。青春不是年紀，是你還願不願意，把自己放到一個會發亮、也會要命的地方。"]},
 2:{pub:"約翰．繆爾 著｜呂奕欣 譯｜臉譜 2020（2026 改版）",
    ps:["約翰．繆爾十一歲從蘇格蘭跟著全家移民到美國威斯康辛，後來在工廠的一次意外裡險些失明。眼睛好了以後，他開始走路。一八六九年夏天，他受邀跟著牧羊人和一大群羊，在內華達山區走了一整個夏天，一路記：美熹德河、優勝美地、特納亞湖、莫諾湖、圖奧勒米。",
        "這些手札他放了四十多年，七十三歲才改寫成書。所以你讀到的，是一個老人回頭看那個初次進山的年輕人，眼睛還是亮的。後來他促成優勝美地改由聯邦管轄，創立山巒俱樂部，當會長直到過世。",
        "這本書沒有驚險，只有一個人，認真地看。"]},
 3:{pub:"柏娜黛．麥當勞 著｜劉麗真 譯｜臉譜 2021",
    ps:["一九七〇到九〇年代，波蘭還在鐵幕裡。那裡的登山家在國內做苦工、清理和彩繪工廠煙囪，出國時走私威士忌和舶來品換經費；衣服從布料和拉鍊開始手縫，登山靴請鞋匠做，冰斧請鐵匠打。然後他們去了喜馬拉雅，在最艱難的冬季，爬八千公尺的山。",
        "庫庫奇卡爬完十四座：十座走新路線、四座在冬天、一座獨攀，一九八九年死在洛子峰南壁。汪達．盧凱維茲是第一位登上聖母峰的歐洲女性，一九九二年死在干城章嘉。黃金年代怎麼結束的？書上說不是政治，是日子好過了，海外登山的魅力不再。",
        "原來最強的，常常長在最窮的地方。"]},
 4:{pub:"克里斯．鮑寧頓 著｜林友民 譯｜臉譜 2021",
    ps:["一九七〇年，克里斯．鮑寧頓帶了二十一個人去尼泊爾：七個攀登隊員、一個醫生、基地營經理、電視轉播團隊，還有郵差、廚師和雪巴。目標是安娜普納南壁，頂峰八千零九十一公尺，從底到頂落差近三千六百公尺，從來沒有人爬過。",
        "整整兩個月，章節照著日期走：跋涉、聖殿、鞍部、冰脊、冰崖、大岩階帶、鐵熨斗、消耗戰、最後一擊。他們成功了。然後第十八章，叫做悲劇。書介只說：遠征即將結束前，一件令所有人心碎的事發生了。",
        "詹偉雄說這趟是喜馬拉雅的轉捩點：從此登山的目標不再是登頂，而是走一條困難的路。"]},
 5:{pub:"詹偉雄 選編｜劉麗真、林友民、李屹 譯｜臉譜 2021",
    ps:["這不是一本故事書。詹偉雄從十九世紀中葉到二十世紀初的歐洲，挑了十一個人的十七篇文章：廷德爾、萊斯禮．史蒂芬、溫珀、馬默理、溫斯洛普．楊、馬洛里、榮赫鵬、賀曼．布爾、馬丁．康威、齊美爾、諾伊斯。那是人類剛開始爬山、還說不清自己為什麼要爬的年代。",
        "馬洛里說登山者是藝術家，史蒂芬寫一個登山家的懊悔，溫珀寫「但是，繩索斷了」，社會學家齊美爾談山岳的美學。書介問：高山如此危險且致命，仍有無數人即使犧牲生命也要登上，登山的意義是什麼？它給的方向是：登山者，其實就是現代人的隱喻。",
        "你不爬山，也在爬。"]},
 6:{pub:"珍妮佛．喬登 著｜呂奕欣 譯｜臉譜 2022",
    ps:["最早登上 K2 的五個女人：汪妲．魯特凱維奇、莉莉安．巴哈德、茱莉．特利斯、向黛兒．莫迪、艾莉森．哈葛利夫。到一九九八年，五個人全部不在了，三個死在 K2 下山的路上。艾莉森一九九五年五月才無氧登上聖母峰，八月十三日登頂 K2，下撤途中去世。",
        "珍妮佛．喬登為了拍紀錄片，兩次住在 K2 山腳下。起點是一九九八年，她讀到的一篇悼念文章。這本書的章名裡有「母親與山」，有「熱情的代價」。",
        "山對每個人一樣殘暴，人對女人多一層。被山考驗一次，再被人考驗一次，她們還是去了。"]},
 7:{pub:"韋德．戴維斯 著｜鄭煥昇 譯｜臉譜 2022（上下冊）",
    ps:["韋德．戴維斯花了十年，讀了六百多本書，走訪喜馬拉雅，寫英國一九二一、一九二二、一九二四年三次聖母峰遠征。但上冊幾乎都在講第一次世界大戰，講大英帝國和圖博的紛爭，下冊才真的入山：北坳、眾人渴望的山巔、生命之索、生命的代價是死亡。",
        "因為他要講的不是爬山，是那一代從戰壕回來的人，為什麼把生死看得那麼輕。一九二四年六月八日，馬洛里和二十一歲的山帝．爾文消失在接近山頂的地方。一九九九年，馬洛里的遺體在北壁八千二百三十公尺處被找到。",
        "書介說：本書想探究的，並非馬洛里是否登頂，而是究竟是什麼讓這群登山家寧可犧牲也要奮力攀進，直至生命最後一刻。"]},
 8:{pub:"喬．塔斯克 著｜鄭煥昇 譯｜臉譜 2023",
    ps:["《輝耀之山》裡那個冷淡、讓彼得焦慮的搭檔，喬．塔斯克，一九四八年生於英格蘭赫爾，是第一個在冬天爬上艾格峰北壁的英國人。這本書是他自己寫的：七章，七座山。艾格峰、開車橫越歐亞大陸去爬的都納吉里峰、強卡邦峰（換他的視角再講一次）、兩次失敗的 K2、新路線無氧首登的干城章嘉，最後一章叫「世界末日」。",
        "一九八二年，他在出發去聖母峰的前夕把書稿交出去。五月十七日，他和彼得最後一次被看見，在兩萬七千英尺高的東北脊。出版者在序裡說，這本書是獻給喬的紀念碑。",
        "你讀的是一個人最後的告白，而他自己不知道那是最後。"]},
 9:{pub:"約翰．波特 著｜李忞 譯｜張元植 審訂｜臉譜 2024",
    ps:["艾利克斯．麥金泰爾，七〇年代竄起的英國天才，主張輕量速攀：不帶帳篷，不帶大量食物和瓦斯，專找沒人爬過的線。他自己寫過：雄心指向山壁，風格成了執迷。一九八二年十月十七日，他在安娜普納南壁被一顆落石擊中，二十八歲。母親吉恩把這句古諺刻在南壁的碑上。",
        "寫這本書的約翰．波特大他八歲，里茲大學登山社認識，十年繩伴。那一趟三人小組，波特因為腹瀉留在基地營，成了把死訊帶回去的人。吉恩要求等她過世後才能出版，原書二〇一四年才問世，離那顆石頭三十二年。",
        "詹偉雄在導讀結尾寫：能當一天的老虎，也就是接近永恆了。"]},
 10:{pub:"艾爾．艾佛瑞茲 著｜鄭煥昇 譯｜臉譜 2024",
    ps:["莫．安東尼，一九三九年生於威爾斯，十九歲起浪跡天涯：阿爾卑斯、多洛米蒂、巴塔哥尼亞、安地斯，再到喜馬拉雅。一九七四到八三年，每年夏天都回去，大多數遠征沒有人知道。一九七七年他和鮑寧頓、道格．史考特首攀「食人魔峰」，史考特摔斷兩隻腳踝，鮑寧頓斷了兩根肋骨，是他把人帶下山。",
        "他不靠登山吃飯，自己開了一間小小的裝備公司。一九八九年腦瘤過世，五十歲。寫他的人是艾爾．艾佛瑞茲，英國詩人，《紐約客》的作者，也是他多年的繩伴。「餵鼠」是西方登山家的俚語：心裡有一隻無形的老鼠，要不斷餵牠，所以得一座一座爬。",
        "推薦序的標題是：攀登才沒那麼多名堂。這是書系的最後一本，主角是十本裡唯一不出名的人。"]},
};

 {b:9,m:["quit", "lost"],q:"一樁恐懼死亡的人生，\n應該是永遠都還沒活過的人生吧！",by:"詹偉雄，《寧為一日猛虎》導讀結尾",

 {b:8,m:["quit", "tired"],q:"我們之所以以身犯險，\n只是因為我們覺得那個終點值得。",by:"詹偉雄，《野蠻競技場》導讀",

 {b:8,m:["stuck", "any"],q:"英國特質：真誠與自虐。",by:"詹偉雄，《野蠻競技場》導讀標題",
  why:"喬．塔斯克一章寫一座山：艾格峰、都納吉里、強卡邦、K2、干城章嘉，再回到 K2。導讀說這是英國式的：對自己誠實到近乎自虐。他把自己的害怕、失敗與猶豫全寫進去，然後交稿，然後上山。",ask:"你對自己誠實到哪裡？"},
 {b:4,m:["lost", "any", "stuck"],q:"每個人心中，都有一座他的安娜普納！",by:"詹偉雄，《靈魂的征途》導讀標題",

 {b:4,m:["lost", "quit"],q:"為何選擇安娜普納？",by:"《靈魂的征途》第二章章名",
  why:"一九七〇年，在全世界都還在用稜線登頂的年代，鮑寧頓選了一面落差近三千六百公尺、從未有人爬過的牆。第二章就叫這個名字。這個問題他問了自己一整章，然後帶著二十一個人去了。",ask:"你選的那條難路，你能說出為什麼嗎？"},
 {b:3,m:["stuck", "tired"],q:"要想獲得勇氣，必須求之在我。",by:"《攀向自由》推薦序標題",

 {b:3,m:["lost", "any"],q:"波蘭的，也是台灣的。",by:"詹偉雄，《攀向自由》導讀標題",

 {b:10,m:["lost", "any"],q:"攀登不為什麼，\n只為了餵養心中的那一隻老鼠。",by:"《餵鼠》中文版書介",

 {b:10,m:["stuck", "tired"],q:"你墜落了，你辯證了，你澄明了……",by:"《餵鼠》導讀標題",

 {b:7,m:["quit", "any"],q:"死亡之前，要過足人生。",by:"詹偉雄，《靜謐的榮光》導讀標題",

 {b:7,m:["tired", "stuck"],q:"生命的代價是死亡。",by:"《靜謐的榮光》第十三章章名",

 {b:6,m:["stuck", "tired"],q:"或許山並不在乎她們的性別，但人類社會在乎。",by:"詹偉雄，《殘暴之巔》導讀",
  why:"最早登上 K2 的五位女性，到一九九八年全部殞落，三位死在下撤的路上。山對每個人一樣殘暴；社會卻對她們多出一層審視，連母親的身分都成為被議論的理由。她們被山考驗，再被人考驗，然後仍然選擇上去。",ask:"你身上那層旁人看不見的重量，是什麼？"},
 {b:6,m:["quit", "stuck"],q:"向死而生，在死境綻放的生命之花。",by:"《殘暴之巔》推薦序標題",

    try{ if(files.length&&navigator.canShare&&navigator.canShare({files})) {await navigator.share({text,files});return;} await navigator.share({text});return; }
    catch(e){ if(e&&e.name==="AbortError") return;
      // 分享面板叫不出來：文字複製起來、圖存下來，留在這頁
      try{ await navigator.clipboard.writeText(text); }catch(_){}
      if(files.length){ const a=document.createElement("a");a.href=URL.createObjectURL(files[0]);a.download="leave-the-ground.png";a.click(); }
      toast("文字複製好了，圖也存下了，到 Threads 貼上"); return; }
  }
  // 電腦沒有分享面板：圖存下來、開 Threads 發文頁
  if(files.length){ const a=document.createElement("a");a.href=URL.createObjectURL(files[0]);a.download="leave-the-ground.png";a.click(); toast("圖片已存下，貼文時附上"); }
  window.open("https://www.threads.net/intent/post?text="+encodeURIComponent(text),"_blank");
}
const site=()=>location.href.split(/[?#]/)[0];


/* 開場句字級：一行塞不下就縮，最小 18px */
function fitIntro(el){

}

const VIEWS={
 any:  ["不用做什麼。","風在這裡比較大。","你聽得到自己的呼吸嗎。","這裡沒有訊號，剛好。",""],
 深夜: ["這個時間，山也醒著。","星星比山下多。",""],

 傍晚: ["光是斜的。","再一下就要變色了。"],
 黃昏: ["山變成剪影了。","今天剩下的光，都在這裡。"],

/* 自動抓新版：比對伺服器上的 ETag，不一樣就重新載入一次（朋友只要重新整理或重開就會拿到最新版） */
(async()=>{try{
  const r=await fetch(location.pathname,{method:"HEAD",cache:"no-store"}); const e=r.headers.get("etag"); if(!e) return;
  const k="ltg-etag", old=localStorage.getItem(k); localStorage.setItem(k,e);
  if(old && old!==e && !sessionStorage.getItem("ltg-reloaded")){ sessionStorage.setItem("ltg-reloaded","1");
    const u=new URL(location.href); u.searchParams.set("r",Date.now().toString(36)); location.replace(u.toString()); }   // 換個帶時間戳的網址，強制抓新版（不吃快取）
  else sessionStorage.removeItem("ltg-reloaded");
}catch(_){}})();
/* ---------- 山是活的（2）：山認得你 ---------- */
const LS={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}}};
const visits=+(LS.get("ltg-visits")||0), lastISO=LS.get("ltg-last"), bestAlt=+(LS.get("ltg-best")||0);
function daysAgo(iso){ if(!iso) return null; const d=(Date.now()-new Date(iso).getTime())/864e5; return d<1?0:Math.floor(d); }
(function(){
  if(visits>0){
    const n=daysAgo(lastISO); const when=n===null?"":(n===0?"今天來過了。":n===1?"上次是昨天。":`上次是 ${n} 天前。`);
    INTRO[0]=`你回來了。${when}`; if(introI===0) introShow();
    if(bestAlt>0) $("#back-line").textContent=`你來過 ${visits} 次，最高到過 ${bestAlt.toLocaleString()} 公尺。`, $("#back-line").hidden=false;
  }
  LS.set("ltg-visits",String(visits+1)); LS.set("ltg-last",new Date().toISOString());
})();
function remember(){ if(alt>bestAlt) LS.set("ltg-best",String(Math.round(alt))); }

/* ---------- 山是活的（3）：手的傾斜 ---------- */
let tiltOn=false;
function onTilt(e){
  if(!$("#s-camp").classList.contains("on")) return;
  const beta=e.beta; if(beta==null) return;           // 0 平放、90 直立
  const k=Math.min(1,Math.max(.3,(beta-5)/40));        // 平放淡（但還讀得到），立到 45 度就全亮；不能妨礙閱讀
  $("#s-camp").style.opacity=k;

}
async function enableTilt(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") return;
    }
    addEventListener("deviceorientation",onTilt); tiltOn=true;
  }catch(_){}
}
/* 預設就開：Android 直接掛；iPhone 要在第一次點擊裡問一次，之後就一直開著 */
if(typeof DeviceOrientationEvent!=="undefined"&&("ontouchstart" in window)){
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    const once=()=>{ enableTilt(); removeEventListener("click",once,true); };
    addEventListener("click",once,true);
  } else enableTilt();
}

/* ---------- 山是活的（4）：海拔 ---------- */
let baseAlt=0;
function enableGeo(){
  if(!navigator.geolocation){toast("這支手機沒有定位");return;}
  $("#b-geo").textContent="山在問……";
  navigator.geolocation.getCurrentPosition(p=>{
    const a=p.coords.altitude;
    if(a==null){ $("#b-geo").textContent="這裡量不到高度"; return; }
    baseAlt=Math.round(a); alt=baseAlt; setAlt(alt);
    $("#b-geo").classList.add("on"); $("#b-geo").textContent=`你現在在 ${baseAlt.toLocaleString()} 公尺`;
  },()=>{ $("#b-geo").textContent="山沒有拿到位置"; },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
if(navigator.geolocation){ $("#b-geo").hidden=false; $("#b-geo").onclick=enableGeo; }

/* ---------- 山是活的（1）：真實時間決定天色，心情只是染一層 ---------- */
const TIMES=[ // [起始小時, 天頂, 中段, 地平線, 星星亮度, 名字, 日光, 山1, 山2, 山3]  字永遠淺色，上半天空永遠夠深
 [0,  "#060a0f","#0e151f","#182230",1.0,"深夜",0.00,"#1f2a38","#161e2a","#0f141c"],
 [4.5,"#101729","#352f52","#c07a66",0.5,"黎明",0.15,"#352c48","#26203a","#191528"],
 [6.5,"#15304f","#275a88","#cfe0ea",0.0,"清晨",0.45,"#3d6a8c","#2f5675","#22425c"],
 [9,  "#183f6a","#2e70aa","#dfeaf1",0.0,"白天",0.55,"#44769a","#355f7f","#274a66"],
 [16, "#1c3250","#4c5878","#e0a06a",0.05,"傍晚",0.35,"#3e5470","#2f4259","#223246"],
 [18, "#12172c","#3b2742","#b85a3e",0.4,"黃昏",0.12,"#31273d","#241c2e","#17121f"],
 [19.5,"#090d17","#151c2b","#25303f",0.9,"夜",0.00,"#223447","#1a2a3b","#131f2c"],
];
let starAlpha=1;
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex2(a),B=hex2(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,"0")).join("");};
function timeSky(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  let i=TIMES.length-1; for(let j=0;j<TIMES.length;j++) if(h>=TIMES[j][0]) i=j;
  const a=TIMES[i], b=TIMES[(i+1)%TIMES.length]; const end=(i+1<TIMES.length)?b[0]:24;
  const k=Math.min(1,Math.max(0,(h-a[0])/Math.max(.01,end-a[0])));
  const sky=[1,2,3].map(n=>mix(a[n],b[n],k)); starAlpha=a[4]+(b[4]-a[4])*k;
  const sun=a[6]+(b[6]-a[6])*k, m=[7,8,9].map(n=>mix(a[n],b[n],k));
  return {sky,sun,m,name:a[5],hhmm:d.toTimeString().slice(0,5)};
}
function applySky(){
  const t=timeSky(), st=document.body.style;
  // 心情的色只染 25%，其餘跟著真實時間
  const md=document.body.dataset.mood; const base=md?MOODSKY[md]:MOODSKY.none;
  st.setProperty("--sky0",mix(t.sky[0],base[0],.25)); st.setProperty("--sky1",mix(t.sky[1],base[1],.25)); st.setProperty("--sky2",mix(t.sky[2],base[2],.25));
  st.setProperty("--m1",t.m[0]); st.setProperty("--m2",t.m[1]); st.setProperty("--m3",t.m[2]);
  $("#sun").style.opacity=t.sun;
  $("#skyname").textContent=`${t.name} ${t.hhmm} 的山`;
}
const MOODSKY={none:["#0e1620","#1b2a3a","#2a3a4a"],stuck:["#0b0f14","#161c24","#2a2f36"],tired:["#141a2a","#23304a","#3a4a63"],lost:["#10171a","#1c2a2c","#2e4144"],quit:["#160f12","#2a1b22","#3e2a33"],any:["#0e1a2a","#1b3350","#2f5070"]};
applySky(); setInterval(applySky,60000);

(function(){const c=$("#stars"),x=c.getContext("2d");let W,H,S=[];
 function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;S=[];for(let i=0;i<140;i++)S.push({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.3*devicePixelRatio+.3,p:Math.random()*6.28});}
 function dr(t){x.clearRect(0,0,W,H);for(const s of S){x.globalAlpha=(.35+.45*Math.sin(t/900+s.p))*starAlpha;x.fillStyle="#e9e4d8";x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}requestAnimationFrame(dr);}
 addEventListener("resize",rs);rs();requestAnimationFrame(dr);})();
</script>
